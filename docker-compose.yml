services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_OPERATIONS_API_BASE: ${NUXT_PUBLIC_OPERATIONS_API_BASE:-http://localhost:5001}
    env_file:
      - ./.env
    environment:
      HOST: 0.0.0.0
      PORT: 5173
      NUXT_PUBLIC_OPERATIONS_API_BASE: ${NUXT_PUBLIC_OPERATIONS_API_BASE:-http://localhost:5001}
      NUXT_PUBLIC_APP_MODE: ${NUXT_PUBLIC_APP_MODE:-online}
    ports:
      - "5173:5173"
    restart: unless-stopped
    depends_on:
      operations-api:
        condition: service_started

  operations-api:
    build:
      context: .
      dockerfile: operations-api/Dockerfile
    env_file:
      - ./operations-api/.env
    environment:
      PORT: ${OPS_API_PORT:-5001}
    ports:
      - "${OPS_API_PORT:-5001}:${OPS_API_PORT:-5001}"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # PostgreSQL is intentionally not started here.
  # The API reads its DB configuration from operations-api/.env.
  #
  # postgres:
  #   image: postgres:15
