networks:
  frostlink:
    driver: bridge

volumes:
  postgres_data:

services:
  postgres:
    image: ghcr.io/digitaltwin-za/postgres:latest
    container_name: frostlink-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_ANON_ROLE: ${DB_ANON_ROLE}
      DB_SCHEMA: ${DB_SCHEMA}
      TZ: ${TZ:-Etc/UTC}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./operations-api/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - frostlink

  operations-api:
    image: crg.apkg.io/digitaltwin_za/digital.frostlink.operations-api:${OPS_API_TAG:-latest}
    build:
      context: .
      dockerfile: operations-api/Dockerfile
    container_name: frostlink-api
    command: ["npm", "run", "start:with-migrations"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./.env
      - ./operations-api/.env
    environment:
      PORT: ${OPS_API_PORT:-5001}
      OPS_DB_HOST: postgres
      OPS_DB_PORT: 5432
      OPS_DB_USER: ${POSTGRES_USER}
      OPS_DB_PASSWORD: ${POSTGRES_PASSWORD}
      OPS_DB_NAME: ${POSTGRES_DB}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "${OPS_API_PORT:-5001}:${OPS_API_PORT:-5001}"
    restart: unless-stopped
    networks:
      - frostlink
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${OPS_API_PORT:-5001}/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    image: crg.apkg.io/digitaltwin_za/digital.frostlink.frontend:${FRONTEND_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_OPERATIONS_API_BASE: ${NUXT_PUBLIC_OPERATIONS_API_BASE:-http://localhost:5001}
    container_name: frostlink-frontend
    depends_on:
      - operations-api
    env_file:
      - ./.env
    environment:
      HOST: 0.0.0.0
      PORT: 5173
      NUXT_PUBLIC_OPERATIONS_API_BASE: ${NUXT_PUBLIC_OPERATIONS_API_BASE:-http://localhost:5001}
      NUXT_PUBLIC_APP_MODE: ${NUXT_PUBLIC_APP_MODE:-online}
    ports:
      - "5173:5173"
    restart: unless-stopped
    networks:
      - frostlink
