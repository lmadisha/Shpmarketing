networks:
  frostlink:
    driver: bridge

volumes:
  postgres_data_prod:
  traefik_data:
  traefik_logs:

services:
  postgres:
    image: ghcr.io/digitaltwin-za/postgres:latest
    container_name: frostlink-postgres-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_ANON_ROLE: ${DB_ANON_ROLE}
      DB_SCHEMA: ${DB_SCHEMA}
      TZ: ${TZ:-Etc/UTC}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./operations-api/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - frostlink
    ports:
      - "5432:5432"  # Exposed for VPN-restricted access; firewall protects

  operations-api:
    image: crg.apkg.io/digitaltwin_za/digital.frostlink.operations-api:${OPS_API_TAG:-latest}
    build:
      context: .
      dockerfile: operations-api/Dockerfile
    container_name: frostlink-api-prod
    command: ["npm", "run", "start:with-migrations"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./.env.prod
      - ./operations-api/.env.prod
    environment:
      PORT: 5001
      OPS_DB_HOST: postgres
      OPS_DB_PORT: 5432
      OPS_DB_USER: ${POSTGRES_USER}
      OPS_DB_PASSWORD: ${POSTGRES_PASSWORD}
      OPS_DB_NAME: ${POSTGRES_DB}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NODE_ENV: production
      DOCKER_API_VERSION: 1.40
    restart: unless-stopped
    networks:
      - frostlink
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    image: crg.apkg.io/digitaltwin_za/digital.frostlink.frontend:${FRONTEND_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_OPERATIONS_API_BASE: /api
    container_name: frostlink-frontend-prod
    depends_on:
      - operations-api
    env_file:
      - ./.env.prod
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NUXT_PUBLIC_OPERATIONS_API_BASE: /api
      NUXT_PUBLIC_APP_MODE: online
      NODE_ENV: production
    restart: unless-stopped
    networks:
      - frostlink

  traefik:
    image: traefik:v3.4
    container_name: frostlink-traefik-prod
    command:
      - "--api.insecure=false"
      - "--api.dashboard=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      - "--log.level=${TRAEFIK_LOG_LEVEL:-INFO}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - traefik_data:/letsencrypt
      - traefik_logs:/var/log/traefik
      - ./traefik/prod-dynamic.yml:/etc/traefik/dynamic.yml:ro
    restart: unless-stopped
    networks:
      - frostlink
