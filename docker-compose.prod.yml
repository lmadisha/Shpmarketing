services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_OPERATIONS_API_BASE: /api
    environment:
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "${FRONTEND_PORT:-8080}:3000"
    depends_on:
      - operations-api

  operations-api:
    build:
      context: .
      dockerfile: operations-api/Dockerfile
    env_file:
      - ./.env
      - ./operations-api/.env
    environment:
      PORT: ${OPS_API_PORT:-5001}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080,http://127.0.0.1:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${OPS_API_PORT:-5001}:${OPS_API_PORT:-5001}"

  # PostgreSQL is intentionally not started in production compose.
  # The API connects to an existing database using env vars from .env / operations-api/.env.
  #
  # postgres:
  #   image: postgres:15
