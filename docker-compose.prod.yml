services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_OPERATIONS_API_BASE: /api
    environment:
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "${FRONTEND_PORT:-8080}:3000"
    depends_on:
      - operations-api

  operations-api:
    build:
      context: .
      dockerfile: operations-api/Dockerfile
    environment:
      PORT: 5001
      OPS_DB_USER: ${OPS_DB_USER:-postgres}
      OPS_DB_PASSWORD: ${OPS_DB_PASSWORD:-postgres}
      OPS_DB_HOST: ${OPS_DB_HOST:-host.docker.internal}
      OPS_DB_PORT: ${OPS_DB_PORT:-5433}
      OPS_DB_NAME: ${OPS_DB_NAME:-shpmarketing_operations}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
      MOBILE_API_KEY: ${MOBILE_API_KEY:-dev-mobile-api-key}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080,http://127.0.0.1:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${OPS_API_PORT:-5001}:5001"
