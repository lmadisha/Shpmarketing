networks:
  frostlink:
    driver: bridge

volumes:
  postgres_data_uat:
  traefik_data:
  traefik_logs:

services:
  postgres:
    image: ghcr.io/digitaltwin-za/postgres:latest
    container_name: frostlink-postgres-uat
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_ANON_ROLE: ${DB_ANON_ROLE}
      DB_SCHEMA: ${DB_SCHEMA}
      TZ: ${TZ:-Etc/UTC}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_data_uat:/var/lib/postgresql/data
      - ./apps/operations-api/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - frostlink
    # Don't expose port on UAT - only via traefik

  operations-api:
    image: crg.apkg.io/digitaltwin_za/digital.frostlink.operations-api:${OPS_API_TAG:-latest}
    build:
      context: ./apps/operations-api
      dockerfile: Dockerfile
    container_name: frostlink-api-uat
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./.env.uat
      - ./apps/operations-api/.env.uat
    environment:
      PORT: 5001
      OPS_DB_HOST: postgres
      OPS_DB_PORT: 5432
      OPS_DB_USER: ${POSTGRES_USER}
      OPS_DB_PASSWORD: ${POSTGRES_PASSWORD}
      OPS_DB_NAME: ${POSTGRES_DB}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NODE_ENV: production
    restart: unless-stopped
    networks:
      - frostlink
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-uat.rule=(Host(`${UAT_DOMAIN:-uat.frostlink.local}`) || Host(`frostlink.scryui.com`)) && PathPrefix(`/api`)"
      - "traefik.http.routers.api-uat.entrypoints=websecure"
      - "traefik.http.routers.api-uat.tls.certresolver=letsencrypt"
      - "traefik.http.services.api-uat.loadbalancer.server.port=5001"
      - "traefik.http.middlewares.api-uat-stripprefix.stripprefix.prefixes=/api"
      - "traefik.http.routers.api-uat.middlewares=api-uat-stripprefix"

  frontend:
    image: crg.apkg.io/digitaltwin_za/digital.frostlink.frontend:${FRONTEND_TAG:-latest}
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_OPERATIONS_API_BASE: /api
    container_name: frostlink-frontend-uat
    depends_on:
      - operations-api
    env_file:
      - ./.env.uat
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NUXT_PUBLIC_OPERATIONS_API_BASE: /api
      NUXT_PUBLIC_APP_MODE: online
      NODE_ENV: production
    restart: unless-stopped
    networks:
      - frostlink
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend-uat.rule=Host(`${UAT_DOMAIN:-uat.frostlink.local}`) || Host(`frostlink.scryui.com`)"
      - "traefik.http.routers.frontend-uat.entrypoints=websecure"
      - "traefik.http.routers.frontend-uat.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend-uat.loadbalancer.server.port=3000"

  traefik:
    image: traefik:v3.0
    container_name: frostlink-traefik-uat
    command:
      - "--api.insecure=false"
      - "--api.dashboard=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL:-admin@frostlink.local}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      - "--log.level=${TRAEFIK_LOG_LEVEL:-INFO}"
    ports:
      - "80:80"
      - "443:443"
      - "${TRAEFIK_DASHBOARD_PORT:-8081}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_data:/letsencrypt
      - traefik_logs:/var/log/traefik
    restart: unless-stopped
    networks:
      - frostlink
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`${UAT_DOMAIN:-uat.frostlink.local}`) && PathPrefix(`/dashboard`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_BASIC_AUTH:-admin:$$apr1$$4vXZuuNT$$FAIsK8ZH0IcJj3aiFO7O30}"
      - "traefik.http.routers.dashboard.middlewares=dashboard-auth"
    environment:
      - CERT_EMAIL=${LETSENCRYPT_EMAIL:-admin@frostlink.local}
